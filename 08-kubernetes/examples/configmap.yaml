# =============================================================================
# Kubernetes ConfigMap — sync-service-config
# =============================================================================
# A ConfigMap decouples configuration from container images, following the
# twelve-factor app methodology (Factor III: Store config in the environment).
#
# Interview key points:
# - ConfigMaps store non-sensitive, non-encrypted configuration data
# - For sensitive data (passwords, API keys, TLS certs), use Secrets instead
# - ConfigMaps are namespace-scoped
# - Maximum size: 1 MiB (etcd storage limit)
# - ConfigMaps are stored in etcd as plaintext (unlike Secrets, which are
#   base64-encoded — though base64 is NOT encryption)
# =============================================================================

apiVersion: v1
# ConfigMap is a core resource, so the apiVersion is "v1".

kind: ConfigMap
# ConfigMap holds configuration data as key-value pairs.
# Interview note: ConfigMap vs Secret:
#   - ConfigMap: plaintext, for non-sensitive config (log levels, feature flags)
#   - Secret: base64-encoded, for sensitive data (passwords, tokens, certs)
#   - Both can be consumed as env vars or mounted as files
#   - Secrets can be encrypted at rest with EncryptionConfiguration
#   - Secrets have type field (Opaque, kubernetes.io/tls, kubernetes.io/dockerconfigjson)

metadata:
  name: sync-service-config
  # The name used to reference this ConfigMap from Deployments, Pods, etc.
  # Must be unique within the namespace.
  # Interview note: a ConfigMap referenced by a Pod must exist BEFORE the Pod
  # is created, unless the reference is marked as optional. Otherwise the Pod
  # will be stuck in CreateContainerConfigError or ContainerCreating state.

  namespace: default
  # ConfigMaps are namespace-scoped. A Pod can only reference ConfigMaps
  # in the same namespace.
  # Interview note: if you need shared configuration across namespaces,
  # consider using a controller that copies ConfigMaps, or Helm/Kustomize
  # to template the same ConfigMap into multiple namespaces.

  labels:
    app: sync-service
  # Labels for organizing and selecting ConfigMaps.
  # Useful for bulk operations: kubectl get configmaps -l app=sync-service

# =============================================================================
# Data Section — Key-Value Configuration
# =============================================================================
data:
  # =========================================================================
  # Simple key-value pairs
  # =========================================================================
  # When consumed via envFrom (in the Deployment), each key below becomes
  # an environment variable with the corresponding value.
  #
  # Interview note: all values MUST be strings. Numbers, booleans, and other
  # types must be quoted. Use "3" not 3, "true" not true.
  # For binary data, use the "binaryData" field instead of "data".
  # =========================================================================

  LOG_LEVEL: "info"
  # Controls application logging verbosity.
  # Common values: debug, info, warn, error.
  # Interview note: in production, use "info" or "warn" to reduce log volume.
  # Change to "debug" temporarily for troubleshooting (update ConfigMap and
  # restart Pods, or use mounted volume approach for live updates).

  GIN_MODE: "release"
  # Gin web framework mode: "debug" (verbose logging) or "release" (production).
  # Interview note: this is a Go/Gin-specific config. In debug mode, Gin logs
  # every request with color-coded output — not suitable for production.

  OTEL_SERVICE_NAME: "sync-service"
  # OpenTelemetry service name used to identify this service in traces.
  # Interview note: this follows the OpenTelemetry semantic conventions.
  # The service name appears in tracing backends (Jaeger, Tempo, Datadog)
  # and is critical for correlating traces across microservices.

  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # gRPC endpoint for the OpenTelemetry Collector.
  # Interview note: "otel-collector" is a Service name in the cluster.
  # Port 4317 is the standard OTLP gRPC port; 4318 is OTLP HTTP.
  # The collector receives, processes, and exports telemetry data
  # to backends (Jaeger, Prometheus, etc.).

  SYNC_INTERVAL: "30s"
  # How often the sync service polls the third-party API.
  # Interview note: even though this looks like a duration, it's stored
  # as a string. The application must parse it (e.g., time.ParseDuration in Go).

  MAX_RETRY_ATTEMPTS: "3"
  # Maximum number of retry attempts for failed sync operations.
  # Interview note: this is a string "3", not an integer.
  # The application converts it with strconv.Atoi() or similar.

  # =========================================================================
  # File-like key (multi-line configuration file)
  # =========================================================================
  # Keys can contain dots and slashes to represent file paths.
  # When mounted as a volume, this key becomes a file named "config.yaml"
  # with the multi-line YAML content below.
  # =========================================================================
  config.yaml: |
    server:
      port: 8080
      read_timeout: 10s
      write_timeout: 10s
    sync:
      interval: 30s
      batch_size: 100
      max_retries: 3
    logging:
      level: info
      format: json
  # The "|" (pipe) preserves newlines in the multi-line value (YAML literal block scalar).
  # Interview note: ">" (greater-than) would fold newlines into spaces (folded block scalar).
  #
  # To mount this as a file in a Pod:
  #
  # volumes:
  #   - name: config-volume
  #     configMap:
  #       name: sync-service-config
  #       items:
  #         - key: config.yaml        # the ConfigMap key
  #           path: config.yaml       # the filename in the mount
  #
  # containers:
  #   - volumeMounts:
  #       - name: config-volume
  #         mountPath: /etc/sync-service/config.yaml
  #         subPath: config.yaml      # mount single file, not entire directory
  #         readOnly: true
  #
  # Interview note on subPath:
  # Without subPath, the entire mountPath directory is replaced by the volume.
  # With subPath, only the specific file is mounted, preserving other files
  # in the directory. However, subPath mounts do NOT receive automatic updates.

# =============================================================================
# How ConfigMaps are consumed — Interview reference
# =============================================================================
#
# Method 1: Environment variables with envFrom (bulk import)
# ----------------------------------------------------------
#   envFrom:
#     - configMapRef:
#         name: sync-service-config
#   All keys become env vars. Keys with invalid env var names (dots, etc.)
#   are skipped. In this ConfigMap, "config.yaml" would be skipped as an
#   env var because dots are not valid in environment variable names.
#
# Method 2: Environment variables with env (individual keys)
# ----------------------------------------------------------
#   env:
#     - name: MY_LOG_LEVEL
#       valueFrom:
#         configMapKeyRef:
#           name: sync-service-config
#           key: LOG_LEVEL
#   Allows renaming keys and selecting specific ones.
#
# Method 3: Volume mount (as files)
# ----------------------------------------------------------
#   volumes:
#     - name: config
#       configMap:
#         name: sync-service-config
#   Each key becomes a file in the mounted directory.
#   The filename is the key, and the file content is the value.
#
# =============================================================================
# ConfigMap Update Behavior — Interview critical topic
# =============================================================================
#
# When you update a ConfigMap:
#
# 1. Environment variables: NOT updated automatically.
#    The Pod must be restarted to pick up new values.
#    Use "kubectl rollout restart deployment/sync-service" to trigger a restart.
#
# 2. Volume-mounted files (without subPath): Updated automatically.
#    The kubelet periodically syncs mounted ConfigMaps (default sync period ~1 min).
#    The update uses atomic symlink swap — the app sees the change all at once.
#    However, the app must watch for file changes or periodically re-read the file.
#    Interview note: there can be a delay of up to kubelet sync period +
#    ConfigMap cache TTL before the mounted file is updated.
#
# 3. Volume-mounted files (with subPath): NOT updated automatically.
#    subPath mounts are bound at container start and never refreshed.
#
# Interview note: for truly dynamic configuration, consider using a
# configuration management tool like Spring Cloud Config, Consul, or
# a custom controller that watches ConfigMaps and signals the app.
#
# =============================================================================
# ConfigMap Best Practices — Interview talking points
# =============================================================================
#
# 1. Use immutable ConfigMaps (immutable: true) for configs that never change.
#    This reduces load on the API server (no watches needed) and prevents
#    accidental updates. Once set to immutable, it cannot be changed — only
#    deleted and recreated.
#
# 2. Name ConfigMaps with a hash suffix (e.g., sync-service-config-abc123)
#    to force Pod restarts when config changes. Helm and Kustomize do this
#    automatically with configMapGenerator or checksum annotations.
#
# 3. Keep ConfigMaps small and focused. Don't put all config in one giant
#    ConfigMap. Group related settings together.
#
# 4. Use Kustomize overlays or Helm values to manage environment-specific
#    configurations (dev, staging, production) from a single base.
#
# 5. Document all keys and their expected values. ConfigMap keys have no
#    schema validation — typos in keys or values won't be caught by Kubernetes.
#
# =============================================================================
# immutable: true
# Uncomment to make this ConfigMap immutable. Once set, the data cannot be
# modified. Any change requires deleting and recreating the ConfigMap.
# Interview note: immutable ConfigMaps are a Kubernetes 1.21+ stable feature.
# They improve cluster performance by eliminating the need for the API server
# to maintain watches on these ConfigMaps.
