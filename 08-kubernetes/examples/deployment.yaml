# =============================================================================
# Kubernetes Deployment — sync-service
# =============================================================================
# A Deployment is a higher-level abstraction over ReplicaSets.
# It provides declarative updates for Pods and ReplicaSets.
#
# Interview key points:
# - Deployment creates a ReplicaSet, which in turn creates Pods
# - Deployment controller runs in the kube-controller-manager
# - Supports rolling updates, rollbacks, scaling, and pausing
# - "kubectl rollout undo" reverts to a previous ReplicaSet revision
# - Old ReplicaSets are kept (by default 10, controlled by revisionHistoryLimit)
# =============================================================================

apiVersion: apps/v1
# apiVersion tells the API server which resource schema to use.
# "apps/v1" is the stable API group for Deployments since Kubernetes 1.9.
# Interview note: core resources (Pod, Service, ConfigMap) use "v1";
# Deployments, StatefulSets, DaemonSets use "apps/v1".

kind: Deployment
# "kind" identifies the resource type.
# Interview note: other workload kinds include StatefulSet (for stateful apps
# with stable network IDs and persistent storage), DaemonSet (one Pod per node),
# and Job/CronJob (batch workloads).

metadata:
  name: sync-service
  # metadata.name is the unique identifier for this Deployment within its namespace.
  # It must be a valid DNS subdomain name (lowercase, alphanumeric, hyphens).

  namespace: default
  # namespace provides logical isolation within a cluster.
  # Interview note: Namespaces do NOT provide network isolation by default;
  # you need NetworkPolicies for that. Namespaces scope RBAC, resource quotas,
  # and limit ranges.

  labels:
    app: sync-service
    version: v1
  # Labels are key-value pairs used for organizing and selecting resources.
  # Interview note: labels are used by selectors (equality-based or set-based)
  # to group resources. They are NOT the same as annotations.
  # Annotations store non-identifying metadata (build info, tool config, etc.).

spec:
  replicas: 3
  # replicas defines the desired number of Pod instances.
  # The Deployment controller continuously reconciles actual state vs desired state.
  # Interview note: if a Pod dies, the controller creates a replacement to maintain
  # the desired count. This is the core reconciliation loop pattern in Kubernetes.
  # For autoscaling, use HorizontalPodAutoscaler (HPA) which adjusts replicas
  # based on CPU/memory utilization or custom metrics.

  selector:
    matchLabels:
      app: sync-service
    # selector defines how the Deployment finds which Pods to manage.
    # Interview critical point: selector.matchLabels MUST match template.metadata.labels.
    # If they don't match, the API server will reject the Deployment.
    # This selector is immutable after creation — you cannot change it.
    # Interview note: matchLabels uses equality-based selection;
    # matchExpressions allows set-based selection (In, NotIn, Exists, DoesNotExist).

  strategy:
    type: RollingUpdate
    # strategy.type controls how old Pods are replaced with new ones.
    # Two options:
    #   - RollingUpdate (default): gradually replaces Pods, ensuring availability
    #   - Recreate: kills ALL old Pods before creating new ones (causes downtime)
    # Interview note: use Recreate when your app cannot run multiple versions
    # simultaneously (e.g., database migrations, single-writer constraints).

    rollingUpdate:
      maxUnavailable: 1
      # maxUnavailable: max number of Pods that can be unavailable during the update.
      # Can be an absolute number (1) or percentage (25%).
      # With 3 replicas and maxUnavailable=1, at least 2 Pods are always running.

      maxSurge: 1
      # maxSurge: max number of Pods that can be created over the desired replica count.
      # Can be an absolute number (1) or percentage (25%).
      # With 3 replicas and maxSurge=1, at most 4 Pods can exist during update.
      #
      # Interview note: the combination of maxUnavailable and maxSurge controls
      # the speed vs. resource usage tradeoff during deployments.
      # maxUnavailable=0 + maxSurge=1 = safest (no downtime, slow rollout)
      # maxUnavailable=1 + maxSurge=0 = no extra resources needed, but 1 pod down

  # revisionHistoryLimit: 10
  # (default is 10) Number of old ReplicaSets to retain for rollback.
  # Interview note: "kubectl rollout undo deployment/sync-service" reverts to
  # the previous revision. Each update creates a new ReplicaSet.

  # minReadySeconds: 0
  # (default is 0) Minimum seconds a new Pod must be ready (without any container
  # crashing) before it is considered available. Useful for catching startup crashes.

  template:
    # template defines the Pod specification. This is essentially a PodSpec
    # wrapped in metadata. Every Pod created by this Deployment uses this template.

    metadata:
      labels:
        app: sync-service
        version: v1
      # These labels MUST include the labels matched by spec.selector.matchLabels.
      # You can add additional labels here (like "version") for more granular selection,
      # e.g., by Istio for traffic splitting between v1 and v2.

      # annotations:
      #   prometheus.io/scrape: "true"
      #   prometheus.io/port: "8080"
      # Annotations are commonly used for Prometheus scraping config,
      # Istio sidecar injection, and other tool-specific metadata.

    spec:
      containers:
        - name: sync-service
          # Each container in a Pod must have a unique name.
          # Interview note: a Pod can have multiple containers (sidecar pattern).
          # Common sidecar use cases: logging agents, service mesh proxies (Envoy),
          # and configuration reloaders.

          image: sync-service:latest
          # Interview warning: "latest" tag is NOT recommended in production.
          # Use specific image tags or SHA digests for reproducibility.
          # "latest" + imagePullPolicy=Always causes unnecessary pulls;
          # "latest" + imagePullPolicy=IfNotPresent can serve stale images.

          # imagePullPolicy: IfNotPresent
          # Options: Always, IfNotPresent, Never
          # Default: Always if tag is "latest", IfNotPresent otherwise.
          # Interview note: for production, pin image versions and use IfNotPresent.

          ports:
            - containerPort: 8080
              name: http
              # containerPort is informational — it documents which port the
              # container listens on. It does NOT actually open or restrict ports.
              # Naming the port ("http") lets other resources reference it by name
              # instead of number (see Service targetPort and probe port below).

          # =====================================================================
          # Environment Variables from ConfigMap (bulk import)
          # =====================================================================
          envFrom:
            - configMapRef:
                name: sync-service-config
              # envFrom imports ALL key-value pairs from the ConfigMap as env vars.
              # Each key in the ConfigMap becomes an environment variable name.
              # Interview note: if the ConfigMap doesn't exist and it's not marked
              # optional, the Pod will fail to start (stuck in CreateContainerConfigError).
              # prefix: "APP_"  # optional — prepends a prefix to each variable name

          # =====================================================================
          # Environment Variables from Secret (individual keys)
          # =====================================================================
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sync-service-secrets
                  key: database-url
              # Pulls a single key from a Secret and maps it to the env var DATABASE_URL.
              # Interview note: Secrets are base64-encoded, NOT encrypted by default.
              # For real encryption at rest, enable EncryptionConfiguration on the API server
              # or use an external secrets manager (Vault, AWS Secrets Manager, etc.).

            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: sync-service-secrets
                  key: api-key
              # Interview note: using individual env vars from Secrets (vs envFrom)
              # gives you explicit control over which keys are exposed.
              # secretKeyRef also supports an "optional" field — if true, the Pod
              # starts even if the Secret/key is missing.

          # =====================================================================
          # Resource Requests and Limits
          # =====================================================================
          resources:
            requests:
              cpu: 100m
              # "100m" = 100 millicores = 0.1 CPU core.
              # Interview note: requests are used by the scheduler (kube-scheduler)
              # to decide which node has enough capacity to place this Pod.
              # The Pod is GUARANTEED to get at least this much CPU.

              memory: 128Mi
              # "128Mi" = 128 mebibytes (1 Mi = 1024 * 1024 bytes).
              # Interview note: memory requests affect scheduling and QoS class.
              # Unlike CPU (compressible), memory is incompressible — if a node
              # runs out of memory, Pods are evicted based on QoS class.

            limits:
              cpu: 500m
              # CPU limit: the container is throttled (not killed) if it exceeds this.
              # Interview note: CPU is a compressible resource. The kernel uses CFS
              # (Completely Fair Scheduler) quotas to enforce CPU limits.
              # Some teams omit CPU limits to avoid throttling; this is debated.

              memory: 256Mi
              # Memory limit: the container is OOMKilled if it exceeds this.
              # Interview note: memory is incompressible. When a container exceeds
              # its memory limit, the OOM killer terminates it (exit code 137).
              # The Pod restarts according to its restartPolicy (default: Always).

          # Interview note on QoS Classes (determined by requests/limits):
          # - Guaranteed: requests == limits for all containers (highest priority)
          # - Burstable: requests < limits (or only requests set) (medium priority)
          # - BestEffort: no requests or limits set (lowest priority, evicted first)
          # This Deployment is Burstable because requests != limits.

          # =====================================================================
          # Liveness Probe — Is the container alive?
          # =====================================================================
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              # Uses the named port "http" (resolves to containerPort 8080).
              # Interview note: three probe types available:
              #   1. httpGet — HTTP GET request; 200-399 = success
              #   2. tcpSocket — TCP connection attempt; connection = success
              #   3. exec — runs a command in the container; exit code 0 = success
              # grpc probes (grpc:) are also available since Kubernetes 1.24.

            initialDelaySeconds: 15
            # Wait 15 seconds after container starts before running the first probe.
            # Interview note: this gives the application time to initialize.
            # If set too low, the container may be killed before it finishes starting.
            # Consider using startupProbe instead for slow-starting apps.

            periodSeconds: 20
            # Run the probe every 20 seconds.

            timeoutSeconds: 5
            # Each probe attempt times out after 5 seconds.

            failureThreshold: 3
            # After 3 consecutive failures, the container is considered unhealthy.
            # Interview critical point: liveness failure triggers a container RESTART
            # (not Pod deletion). The kubelet restarts the container in place.
            # Restart policy determines behavior: Always (default), OnFailure, Never.

            # successThreshold: 1
            # (default is 1) Number of consecutive successes needed after a failure
            # to mark the container as healthy again. For liveness, this must be 1.

          # =====================================================================
          # Readiness Probe — Is the container ready to receive traffic?
          # =====================================================================
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              # Readiness often uses a different endpoint than liveness.
              # /readyz can check downstream dependencies (database, cache, etc.)
              # while /healthz only checks if the process itself is alive.

            initialDelaySeconds: 5
            # Readiness probe can start sooner than liveness because we want
            # to start sending traffic as soon as the app is ready.

            periodSeconds: 10
            # Check readiness every 10 seconds.

            timeoutSeconds: 3

            failureThreshold: 3
            # Interview critical point: readiness failure does NOT restart the container.
            # Instead, the Pod's IP is removed from the Service's Endpoints.
            # This means the Pod stops receiving traffic but stays running.
            # Once the probe succeeds again, the Pod is added back to Endpoints.
            #
            # Use case: temporarily remove a Pod from the load balancer during
            # high load, dependency outages, or graceful shutdown.

          # =====================================================================
          # Startup Probe — For slow-starting containers
          # =====================================================================
          startupProbe:
            httpGet:
              path: /healthz
              port: http

            failureThreshold: 30
            periodSeconds: 10
            # Interview note: the startup probe disables liveness and readiness
            # probes until it succeeds for the first time.
            # Max startup time = failureThreshold * periodSeconds = 30 * 10 = 300s (5 min).
            # After the startup probe succeeds, liveness and readiness take over.
            #
            # This is preferred over a large initialDelaySeconds on liveness because:
            # 1. It allows fast detection of truly broken containers (checks every 10s)
            # 2. It doesn't permanently delay liveness checks after restarts
            # 3. It clearly separates startup concerns from ongoing health checks

      # =====================================================================
      # Pod-level settings
      # =====================================================================

      terminationGracePeriodSeconds: 30
      # When a Pod is deleted, Kubernetes sends SIGTERM to the container.
      # The container has 30 seconds (this value) to shut down gracefully.
      # After this period, SIGKILL is sent to force termination.
      #
      # Interview note on Pod termination lifecycle:
      # 1. Pod is set to "Terminating" state
      # 2. preStop hook runs (if defined)
      # 3. SIGTERM is sent to PID 1 in the container
      # 4. Pod is removed from Service Endpoints (no new traffic)
      # 5. After terminationGracePeriodSeconds, SIGKILL is sent
      #
      # Important: steps 2-4 happen IN PARALLEL, not sequentially.
      # This means your app might still receive traffic briefly after SIGTERM.
      # A common pattern: add a preStop hook with a small sleep to allow
      # Endpoints to update before the app starts shutting down.
      #
      # preStop:
      #   exec:
      #     command: ["sh", "-c", "sleep 5"]

      # restartPolicy: Always
      # Options: Always (default), OnFailure, Never.
      # For Deployments, this must be "Always".
      # Jobs typically use "OnFailure" or "Never".

      # serviceAccountName: sync-service-sa
      # Interview note: every Pod runs under a ServiceAccount. If not specified,
      # the "default" ServiceAccount in the namespace is used.
      # ServiceAccounts are used with RBAC to control what the Pod can access
      # in the Kubernetes API (e.g., reading ConfigMaps, listing Pods).

      # nodeSelector:
      #   disktype: ssd
      # Simple node selection based on labels. For more complex rules,
      # use nodeAffinity (preferred/required) or podAffinity/podAntiAffinity.
      #
      # Interview note: Pod scheduling decision factors:
      # 1. Resource requests (does the node have enough CPU/memory?)
      # 2. nodeSelector / nodeAffinity (does the node have the right labels?)
      # 3. Taints and tolerations (is the Pod allowed on this node?)
      # 4. podAffinity/podAntiAffinity (co-locate or spread Pods?)
      # 5. topologySpreadConstraints (even distribution across zones/nodes)
