# =============================================================================
# docker-compose.yml — Local Development Stack
# =============================================================================
#
# This Compose file defines a complete local development environment with
# three services: the Go application, a PostgreSQL database, and Jaeger
# for distributed tracing via OpenTelemetry.
#
# INTERVIEW CONTEXT:
# Docker Compose is the standard tool for defining multi-container
# applications. Key topics covered here:
#   1. Service discovery via DNS (containers reference each other by name)
#   2. depends_on with health check conditions
#   3. Named volumes vs bind mounts
#   4. Port mapping (host:container)
#   5. Health check configuration
#   6. Environment variable injection
#
# Usage:
#   docker compose up -d          # Start all services in background
#   docker compose logs -f app    # Tail logs for the app service
#   docker compose down           # Stop and remove containers
#   docker compose down -v        # Also remove named volumes (wipes DB data)
#
# NOTE ON VERSION FIELD:
# The "version" key (e.g., version: "3.9") is obsolete in modern Docker
# Compose (v2+). The Compose specification no longer requires it.
# Including it is harmless but unnecessary. We omit it here intentionally
# to follow current best practices. If you're using docker-compose v1
# (the Python-based tool), you may need to add it back.
# =============================================================================


services:

  # ===========================================================================
  # APP SERVICE — The Go microservice
  # ===========================================================================
  app:
    # -------------------------------------------------------------------------
    # Build Configuration
    # -------------------------------------------------------------------------
    # "build" tells Compose to build the image from a Dockerfile rather than
    # pulling a pre-built image from a registry.
    #
    # context: The build context — the directory sent to the Docker daemon.
    #   All COPY/ADD instructions in the Dockerfile are relative to this path.
    #   "." means the current directory (where docker-compose.yml lives).
    #
    # dockerfile: Path to the Dockerfile, relative to the context.
    #   Defaults to "Dockerfile" if omitted. Explicit here for clarity.
    # -------------------------------------------------------------------------
    build:
      context: .
      dockerfile: Dockerfile

    # -------------------------------------------------------------------------
    # Port Mapping — host:container
    # -------------------------------------------------------------------------
    # Maps port 8080 on the HOST machine to port 8080 inside the container.
    # Format: "HOST_PORT:CONTAINER_PORT"
    #
    # The container port must match what your app listens on (and what
    # EXPOSE declares in the Dockerfile, though EXPOSE is just documentation).
    #
    # You can map to a different host port to avoid conflicts:
    #   "9090:8080" — access the app at localhost:9090
    #
    # Only the host port must be unique. Multiple containers can internally
    # listen on the same port (e.g., 8080) because each container has its
    # own network namespace.
    # -------------------------------------------------------------------------
    ports:
      - "8080:8080"

    # -------------------------------------------------------------------------
    # Environment Variables
    # -------------------------------------------------------------------------
    # Injected into the container at runtime. This is how you configure
    # 12-factor apps — no config files baked into the image.
    #
    # DATABASE_URL:
    #   Connection string for PostgreSQL. Note that the hostname is "postgres"
    #   — this is the SERVICE NAME defined below. Docker Compose creates a
    #   default bridge network and registers each service as a DNS entry.
    #   So "postgres" resolves to the IP of the postgres container.
    #   This is Docker's built-in SERVICE DISCOVERY.
    #
    # OTEL_EXPORTER_OTLP_ENDPOINT:
    #   The OpenTelemetry SDK sends traces/metrics to this endpoint.
    #   Again, "jaeger" is the service name, resolved via Docker DNS.
    #   Port 4317 is the standard OTLP gRPC port.
    #
    # SECURITY NOTE:
    #   In production, use Docker secrets or an external secret manager
    #   (Vault, AWS SSM, etc.) instead of plain-text environment variables.
    #   For local development, this is acceptable.
    # -------------------------------------------------------------------------
    environment:
      - DATABASE_URL=postgres://app:secret@postgres:5432/appdb?sslmode=disable
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

    # -------------------------------------------------------------------------
    # depends_on — Service Startup Ordering
    # -------------------------------------------------------------------------
    # Controls the order in which services start. Without depends_on, Compose
    # starts all services in parallel with no guaranteed order.
    #
    # IMPORTANT DISTINCTION (INTERVIEW QUESTION):
    #
    # service_started:
    #   The dependency container has been STARTED (the process is running).
    #   This does NOT mean the service inside is ready to accept connections.
    #   A database container can be "started" but still initializing.
    #
    # service_healthy:
    #   The dependency container's HEALTHCHECK is passing. This means the
    #   service is actually ready (e.g., PostgreSQL is accepting queries).
    #   Requires a healthcheck to be defined on the dependency.
    #
    # service_completed_successfully:
    #   The dependency has run and exited with code 0. Useful for init
    #   containers (e.g., run migrations before starting the app).
    #
    # Below: We wait for postgres to be HEALTHY (accepting connections)
    # but only for jaeger to be STARTED (tracing is best-effort; the app
    # can buffer spans and retry if Jaeger isn't ready yet).
    # -------------------------------------------------------------------------
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

    # -------------------------------------------------------------------------
    # Restart Policy
    # -------------------------------------------------------------------------
    # "unless-stopped" restarts the container if it crashes, but respects
    # manual stops (docker compose stop). Other options:
    #   - "no"          — never restart (default)
    #   - "always"      — always restart, even after manual stop
    #   - "on-failure"  — only restart on non-zero exit code
    # -------------------------------------------------------------------------
    restart: unless-stopped


  # ===========================================================================
  # POSTGRES SERVICE — Relational database
  # ===========================================================================
  postgres:
    # -------------------------------------------------------------------------
    # Image Selection
    # -------------------------------------------------------------------------
    # We use the Alpine variant of the official PostgreSQL image.
    # Alpine-based images are significantly smaller than Debian-based ones:
    #   postgres:16         ~430 MB
    #   postgres:16-alpine  ~110 MB
    #
    # Alpine uses musl libc instead of glibc. This is fine for PostgreSQL
    # and most workloads, but can occasionally cause subtle issues with
    # locale handling or certain extensions. For local development, Alpine
    # is an excellent choice.
    # -------------------------------------------------------------------------
    image: postgres:16-alpine

    # -------------------------------------------------------------------------
    # PostgreSQL Configuration via Environment Variables
    # -------------------------------------------------------------------------
    # The official postgres image reads these env vars on first startup to
    # create the initial database and superuser. They have no effect on
    # subsequent starts (the data already exists in the volume).
    #
    # POSTGRES_USER: The superuser username (default: "postgres")
    # POSTGRES_PASSWORD: The superuser password (required)
    # POSTGRES_DB: The default database to create (default: same as user)
    # -------------------------------------------------------------------------
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb

    # -------------------------------------------------------------------------
    # Port Mapping
    # -------------------------------------------------------------------------
    # Exposes PostgreSQL on the host so you can connect with local tools
    # (psql, pgAdmin, DBeaver) at localhost:5432.
    #
    # Other containers on the same Docker network connect via the service
    # name ("postgres:5432") and do NOT use this port mapping — they
    # communicate over the internal Docker bridge network directly.
    # The ports mapping is only for HOST -> CONTAINER access.
    # -------------------------------------------------------------------------
    ports:
      - "5432:5432"

    # -------------------------------------------------------------------------
    # Volumes — Persistent Data Storage
    # -------------------------------------------------------------------------
    # NAMED VOLUMES vs BIND MOUNTS (INTERVIEW QUESTION):
    #
    # Named Volume (used here — "pgdata"):
    #   - Managed by Docker. Stored in /var/lib/docker/volumes/ on the host.
    #   - Persists across container restarts and recreations.
    #   - Portable: works the same on any OS.
    #   - Better performance on macOS/Windows (avoids filesystem translation).
    #   - Cannot easily browse contents from the host.
    #   - Removed only with `docker compose down -v` or `docker volume rm`.
    #
    # Bind Mount (e.g., ./data:/var/lib/postgresql/data):
    #   - Maps a specific HOST directory into the container.
    #   - Easy to inspect from the host filesystem.
    #   - Can cause permission issues across different OS/user setups.
    #   - Slower on macOS/Windows due to filesystem sharing overhead.
    #   - Useful for development when you need to edit files on the host
    #     and see changes in the container (e.g., mounting source code).
    #
    # tmpfs Mount:
    #   - Stored in host memory only. Not persisted to disk.
    #   - Useful for sensitive data you don't want written to disk.
    #
    # For databases, named volumes are the standard choice — they persist
    # data reliably without host-path coupling.
    # -------------------------------------------------------------------------
    volumes:
      - pgdata:/var/lib/postgresql/data

    # -------------------------------------------------------------------------
    # Health Check — Is PostgreSQL Actually Ready?
    # -------------------------------------------------------------------------
    # A health check runs a command INSIDE the container periodically to
    # verify the service is functional. This is critical for depends_on
    # with condition: service_healthy.
    #
    # pg_isready: A PostgreSQL utility that checks if the server is
    # accepting connections. Exit code 0 = ready, non-zero = not ready.
    #
    # Parameters explained:
    #
    # test: The command to run. Uses "CMD-SHELL" form (runs via /bin/sh)
    #   or "CMD" form (exec, no shell). We need shell for pg_isready.
    #
    # interval: 5s
    #   Time between consecutive health checks. Too frequent = wasted CPU.
    #   Too infrequent = slow detection of unhealthy state. 5-10s is common.
    #
    # timeout: 5s
    #   Max time to wait for the check command to complete. If pg_isready
    #   hangs for more than 5 seconds, the check is considered failed.
    #
    # retries: 5
    #   Number of consecutive failures before the container is marked
    #   "unhealthy". With interval=5s and retries=5, it takes ~25 seconds
    #   of continuous failure to trigger unhealthy status.
    #
    # start_period: 10s
    #   Grace period after container start during which failed health checks
    #   do NOT count toward the retry limit. This gives the service time to
    #   initialize. PostgreSQL might need a few seconds to start accepting
    #   connections, especially on first run when it creates the database.
    # -------------------------------------------------------------------------
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ===========================================================================
  # JAEGER SERVICE — Distributed Tracing Backend
  # ===========================================================================
  # Jaeger collects, stores, and visualizes distributed traces. The
  # "all-in-one" image bundles the collector, query service, and UI into
  # a single container — perfect for local development.
  #
  # In production, you'd deploy these components separately with proper
  # storage backends (Elasticsearch, Cassandra, etc.) instead of the
  # in-memory storage used by all-in-one.
  # ===========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.54

    # -------------------------------------------------------------------------
    # Port Mappings for Jaeger
    # -------------------------------------------------------------------------
    # Jaeger exposes several ports for different protocols:
    #
    # 16686 — Jaeger UI (web interface for viewing traces)
    #   Open http://localhost:16686 in your browser to explore traces.
    #
    # 4317 — OTLP gRPC receiver
    #   The OpenTelemetry SDK in our Go app sends traces here using the
    #   OTLP (OpenTelemetry Protocol) over gRPC. This is the modern,
    #   preferred ingestion protocol.
    #
    # 4318 — OTLP HTTP receiver
    #   Same as above but over HTTP/JSON or HTTP/protobuf. Useful for
    #   environments where gRPC is difficult (e.g., browsers, serverless).
    #
    # Not mapped (but available inside the network):
    #   6831 — Jaeger Thrift (UDP) — legacy agent protocol
    #   14268 — Jaeger HTTP collector — legacy direct submission
    # -------------------------------------------------------------------------
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

    # -------------------------------------------------------------------------
    # Enable the OTLP collector so Jaeger can receive OpenTelemetry data.
    # Without this, only the legacy Jaeger protocols are active.
    # -------------------------------------------------------------------------
    environment:
      - COLLECTOR_OTLP_ENABLED=true


# =============================================================================
# VOLUMES — Top-Level Volume Declarations
# =============================================================================
# Named volumes must be declared at the top level. This tells Docker to
# create and manage the volume. The volume persists even after
# `docker compose down` — you need `docker compose down -v` to remove it.
#
# You can inspect volumes with:
#   docker volume ls
#   docker volume inspect <project>_pgdata
#
# Data lifecycle:
#   docker compose down       — containers removed, volume KEPT
#   docker compose down -v    — containers removed, volume DELETED
#   docker compose up         — if volume exists, data is preserved
# =============================================================================
volumes:
  pgdata:
